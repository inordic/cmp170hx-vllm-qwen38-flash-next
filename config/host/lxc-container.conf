# Proxmox LXC config of the inference container (network line and snapshot names removed).
# Unprivileged container, both GPUs passed through as device nodes, host driver libraries bind-mounted,
# memlock unlimited (pinned host buffers).
arch: amd64
cores: 12
dev0: /dev/nvidia0
dev1: /dev/nvidia1
dev2: /dev/nvidiactl
dev3: /dev/nvidia-uvm
dev4: /dev/nvidia-uvm-tools
features: nesting=1,keyctl=1
hostname: qwen-3.8-flash-next-dual-cmp170hx
memory: 56320
onboot: 1
ostype: ubuntu
rootfs: local-lvm:vm-232-disk-0,size=800G
swap: 8192
unprivileged: 1
lxc.mount.entry: /usr/bin/nvidia-smi usr/bin/nvidia-smi none bind,ro,create=file
lxc.mount.entry: /usr/lib/x86_64-linux-gnu/libcuda.so.610.57.04 usr/lib/x86_64-linux-gnu/libcuda.so.1 none bind,ro,create=file
lxc.mount.entry: /usr/lib/x86_64-linux-gnu/libcuda.so.610.57.04 usr/lib/x86_64-linux-gnu/libcuda.so none bind,ro,create=file
lxc.mount.entry: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.610.57.04 usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1 none bind,ro,create=file
lxc.mount.entry: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.610.57.04 usr/lib/x86_64-linux-gnu/libnvidia-ml.so none bind,ro,create=file
lxc.prlimit.memlock: unlimited
